name: CI

on:
  push:
  pull_request:

jobs:
  zsh:
    name: ${{ matrix.label }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS system zsh (minimum)
            use_brew: false
          - label: Homebrew current zsh
            use_brew: true
    steps:
      - uses: actions/checkout@v4
      - name: Install current zsh
        if: matrix.use_brew
        run: brew install zsh
      - name: Select system zsh
        if: ${{ !matrix.use_brew }}
        run: echo "ZSH_BIN=/bin/zsh" >> "$GITHUB_ENV"
      - name: Select Homebrew zsh
        if: matrix.use_brew
        run: echo "ZSH_BIN=$(brew --prefix zsh)/bin/zsh" >> "$GITHUB_ENV"
      - name: Show interpreter version
        run: "$ZSH_BIN --version"
      - name: Installer checks
        run: sh tests/install.sh
      - name: Unit checks
        run: "$ZSH_BIN tests/unit.zsh"
      - name: Interactive ZLE checks
        run: python3 tests/zle_pty.py
